<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Oba Dellivery - Cardápio Digital</title>
    
    <!-- Preload Google Fonts com fallback -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700;900&family=Source+Sans+3:wght@400;600;700;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700;900&family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Puro - Sem Tailwind */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #ffffff;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Oswald', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            letter-spacing: 0.5px;
        }

        /* CSS Variables */
        :root {
            --accent-primary: #f59e0b;
            --accent-dark: #d97706;
            --accent-light: #fbbf24;
            --bg-dark: #0f0f0f;
            --bg-darker: #1a1a1a;
            --bg-card: #1f1f1f;
            --text-primary: #ffffff;
            --text-secondary: #d1d5db;
            --border-color: #2d2d2d;
            --red-accent: #dc2626;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-darker) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            flex-direction: column;
            gap: 20px;
        }

        .loading-screen.hidden {
            display: none;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border-color);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 16px;
            color: var(--text-secondary);
            text-align: center;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, rgba(15,15,15,0.95) 0%, rgba(26,26,26,0.95) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--accent-primary);
            padding: 16px;
            padding-top: max(16px, env(safe-area-inset-top));
            position: sticky;
            top: 0;
            z-index: 40;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-emoji {
            font-size: 32px;
        }

        .logo-text h1 {
            font-size: 24px;
            font-weight: 900;
            margin: 0;
            color: var(--accent-primary);
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text p {
            font-size: 10px;
            color: var(--text-secondary);
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-header {
            background: var(--accent-primary);
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            appearance: none;
            touch-action: manipulation;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-header:hover {
            background: var(--accent-light);
            transform: scale(1.05);
        }

        .btn-header:active {
            transform: scale(0.98);
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--red-accent);
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 12px;
        }

        /* Main Content */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
        }

        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 24px;
            padding-bottom: 8px;
            scroll-behavior: smooth;
        }

        .filter-tabs::-webkit-scrollbar {
            height: 4px;
        }

        .filter-tabs::-webkit-scrollbar-track {
            background: var(--bg-darker);
        }

        .filter-tabs::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 2px;
        }

        .filter-tab {
            padding: 10px 16px;
            border: 2px solid var(--border-color);
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            transition: all 0.2s;
            white-space: nowrap;
            appearance: none;
            touch-action: manipulation;
            min-height: 44px;
            display: flex;
            align-items: center;
        }

        .filter-tab:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .filter-tab.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: #000;
        }

        /* Products Grid - RESPONSIVO */
        .products-grid {
            display: grid;
            gap: 16px;
            margin-bottom: 40px;
            /* Padrão: 2 colunas em mobile */
            grid-template-columns: repeat(2, 1fr);
        }

        /* Telas muito pequenas: 1 coluna */
        @media (max-width: 360px) {
            .products-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }

        /* Tablets e acima: 3+ colunas */
        @media (min-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 20px;
            }
        }

        @media (min-width: 1024px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 24px;
            }
        }

        .product-card {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            touch-action: manipulation;
            min-height: 280px;
        }

        .product-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-8px);
            box-shadow: 0 16px 40px rgba(245,158,11,0.2);
        }

        .product-emoji {
            font-size: 56px;
            text-align: center;
            padding: 20px 16px;
            background: linear-gradient(135deg, rgba(245,158,11,0.1), rgba(217,119,6,0.1));
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-content {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .product-name {
            font-size: 15px;
            font-weight: 900;
            margin-bottom: 8px;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .product-description {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            line-height: 1.4;
            flex: 1;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .product-price {
            font-size: 18px;
            font-weight: 900;
            color: var(--accent-primary);
        }

        .btn-add {
            background: var(--accent-primary);
            color: #000;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            appearance: none;
            touch-action: manipulation;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .btn-add:hover {
            background: var(--accent-light);
            transform: scale(1.05);
        }

        .btn-add:active {
            transform: scale(0.98);
        }

        /* Builder Layout */
        .builder-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        .builder-ingredients-section {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            width: 100%;
        }

        .builder-category-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 16px;
            padding-bottom: 8px;
        }

        .builder-tab {
            padding: 8px 12px;
            border: 2px solid var(--border-color);
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            transition: all 0.2s;
            white-space: nowrap;
            appearance: none;
            touch-action: manipulation;
            min-height: 40px;
            display: flex;
            align-items: center;
        }

        .builder-tab:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .builder-tab.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: #000;
        }

        .builder-ingredients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
        }

        @media (max-width: 480px) {
            .builder-ingredients-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
                gap: 10px;
            }
        }

        .builder-ingredient-card {
            background: var(--bg-darker);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            touch-action: manipulation;
            user-select: none;
            min-height: 100px;
            justify-content: center;
        }

        .builder-ingredient-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-4px);
        }

        .builder-ingredient-card.selected {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: #000;
        }

        .builder-ingredient-emoji {
            font-size: 32px;
            line-height: 1;
        }

        .builder-ingredient-name {
            font-size: 11px;
            font-weight: 700;
            line-height: 1.2;
        }

        .builder-ingredient-price {
            font-size: 10px;
            color: var(--text-secondary);
        }

        .builder-ingredient-card.selected .builder-ingredient-price {
            color: #000;
        }

        .builder-order-panel {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            width: 100%;
        }

        .builder-panel-header {
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 12px;
        }

        .builder-panel-header h3 {
            font-size: 16px;
            font-weight: 900;
            margin: 0;
        }

        .builder-panel-body {
            max-height: 300px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 12px;
        }

        .builder-panel-body::-webkit-scrollbar {
            width: 6px;
        }

        .builder-panel-body::-webkit-scrollbar-track {
            background: var(--bg-darker);
        }

        .builder-panel-body::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 3px;
        }

        .builder-order-item {
            background: var(--bg-darker);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
        }

        .builder-order-item-title {
            font-weight: 900;
            font-size: 12px;
            margin-bottom: 6px;
            color: var(--accent-primary);
        }

        .builder-order-item-ingredients {
            font-size: 10px;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-bottom: 6px;
        }

        .builder-order-item-price {
            font-size: 12px;
            font-weight: 900;
            color: var(--accent-primary);
        }

        .builder-panel-footer {
            border-top: 2px solid var(--border-color);
            padding-top: 12px;
        }

        .builder-total-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .builder-total-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .builder-total-amount {
            font-size: 20px;
            font-weight: 900;
            color: var(--accent-primary);
        }

        .btn-builder-add {
            width: 100%;
            padding: 12px;
            background: var(--accent-primary);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: 900;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            appearance: none;
            touch-action: manipulation;
            min-height: 44px;
        }

        .btn-builder-add:hover {
            background: var(--accent-light);
            transform: scale(1.02);
        }

        .btn-add-another {
            width: 100%;
            padding: 10px;
            background: transparent;
            color: var(--accent-primary);
            border: 2px solid var(--accent-primary);
            border-radius: 6px;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            appearance: none;
            touch-action: manipulation;
            min-height: 44px;
        }

        .btn-add-another:hover {
            background: var(--accent-primary);
            color: #000;
        }

        /* Promotion Modal */
        .promotion-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .promotion-modal.open {
            display: flex;
        }

        .promotion-content {
            background: var(--bg-darker);
            border: 3px solid var(--accent-primary);
            border-radius: 16px;
            overflow: hidden;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            max-height: 90dvh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(245,158,11,0.4);
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: scale(0.9) translateY(-20px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .promotion-header {
            background: linear-gradient(135deg, rgba(245,158,11,0.2), rgba(217,119,6,0.2));
            padding: 16px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .promotion-title {
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }

        .promotion-close {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
            padding: 4px 8px;
            min-width: 40px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .promotion-close:hover {
            color: var(--accent-primary);
        }

        .promotion-body {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
        }

        .promotion-image {
            width: 100%;
            height: auto;
            max-height: 300px;
            object-fit: contain;
            background: linear-gradient(135deg, rgba(245,158,11,0.1), rgba(217,119,6,0.1));
            display: block;
        }

        .promotion-video {
            width: 100%;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }

        .promotion-video iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .promotion-details {
            padding: 16px;
            flex: 1;
        }

        .promotion-product-name {
            font-size: 16px;
            font-weight: 900;
            margin-bottom: 8px;
            color: var(--accent-primary);
        }

        .promotion-product-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .promotion-product-price {
            font-size: 20px;
            font-weight: 900;
            color: var(--accent-primary);
            margin-bottom: 12px;
        }

        .promotion-footer {
            padding: 16px;
            border-top: 2px solid var(--border-color);
            display: flex;
            gap: 12px;
        }

        .btn-promo {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 900;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            appearance: none;
            touch-action: manipulation;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-promo-add {
            background: var(--accent-primary);
            color: #000;
        }

        .btn-promo-add:hover {
            background: var(--accent-light);
        }

        .btn-promo-skip {
            background: transparent;
            color: var(--text-secondary);
            border: 2px solid var(--border-color);
        }

        .btn-promo-skip:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        /* Cart Sidebar */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: var(--bg-darker);
            border-left: 2px solid var(--border-color);
            z-index: 50;
            transition: right 0.3s;
            display: flex;
            flex-direction: column;
            box-shadow: -8px 0 32px rgba(0,0,0,0.5);
        }

        .cart-sidebar.open {
            right: 0;
        }

        .cart-header {
            padding: 16px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: max(16px, env(safe-area-inset-top));
        }

        .cart-header h2 {
            font-size: 18px;
            font-weight: 900;
            margin: 0;
        }

        .cart-close {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
            padding: 4px 8px;
            min-width: 40px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-close:hover {
            color: var(--accent-primary);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px;
        }

        .cart-items::-webkit-scrollbar {
            width: 6px;
        }

        .cart-items::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        .cart-items::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 3px;
        }

        .cart-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .cart-item-name {
            font-weight: 900;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .cart-item-price {
            font-size: 12px;
            color: var(--accent-primary);
            font-weight: 900;
            margin-bottom: 8px;
        }

        .cart-item-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .cart-item-btn {
            background: var(--bg-darker);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 900;
            transition: all 0.2s;
            appearance: none;
            touch-action: manipulation;
        }

        var promotionShown = false;

        function initializeApp() {
            // Limpar cache de produtos para aplicar novos preços
            localStorage.removeItem("products");
            loadProducts();
            loadCart();
            renderFilterTabs();
            renderProducts();
            checkAndShowPromotion();
        }

        function loadProducts() {
            var saved = localStorage.getItem('products');
            if (saved) {
                try { state.products = JSON.parse(saved); }
                catch (e) { state.products = DEFAULT_PRODUCTS; }
            } else {
                state.products = DEFAULT_PRODUCTS;
            }
        }

        function saveProducts() { localStorage.setItem('products', JSON.stringify(state.products)); }

        function loadCart() {
            var saved = localStorage.getItem('cart');
            if (saved) {
                try { state.cart = JSON.parse(saved); }
                catch (e) { state.cart = []; }
            }
            updateCartUI();
        }

        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(state.cart));
            updateCartUI();
        }

        function renderFilterTabs() {
            var container = document.getElementById('filterTabs');
            var categories = ['all', 'pizza', 'monte-pizza', 'bebida', 'supermercado', 'promocao'];
            var labels = ['Todos', '🍕 Pizzas', '🍕 Monte sua Pizza', '🥤 Bebidas', '🛒 Supermercado', '⭐ Promoção'];
            container.innerHTML = categories.map(function(cat, idx) {
                return '<button class="filter-tab ' + (state.currentFilter === cat ? 'active' : '') + '" onclick="filterByCategory(\'' + cat + '\')">' + labels[idx] + '</button>';
            }).join('');
        }

        function filterByCategory(category) {
            state.currentFilter = category;
            renderFilterTabs();
            var normalSection = document.getElementById('normalProductsSection');
            var builderSection = document.getElementById('builderSection');
            if (category === 'monte-pizza') {
                normalSection.style.display = 'none';
                builderSection.style.display = 'block';
                state.builderType = 'pizza';
                document.getElementById('builderTitle').textContent = '🍕 Sua Pizza';
                state.selectedIngredients = {};
                state.activeCategory = 'massa';
                renderBuilderCategoryTabs();
                renderBuilderIngredients();
                updateBuilderOrderPanel();
            } else {
                normalSection.style.display = 'block';
                builderSection.style.display = 'none';
                renderProducts();
            }
        }

        function renderProducts() {
            var grid = document.getElementById('productsGrid');
            var filtered = state.products;
            if (state.currentFilter !== 'all') {
                filtered = state.products.filter(function(p) { return p.category === state.currentFilter; });
            }
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-state"><div class="empty-state-emoji">😕</div><div class="empty-state-text">Nenhum produto disponível</div></div>';
                return;
            }
            grid.innerHTML = filtered.map(function(product) {
                return '<div class="product-card" onclick="addToCart(' + product.id + ')">' +
                    '<div class="product-emoji">' + product.emoji + '</div>' +
                    '<div class="product-content">' +
                        '<h3 class="product-name">' + product.name + '</h3>' +
                        '<p class="product-description">' + product.description + '</p>' +
                        '<div class="product-footer">' +
                            '<span class="product-price">R$ ' + product.price.toFixed(2) + '</span>' +
                            '<button class="btn-add">Adicionar</button>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function renderBuilderCategoryTabs() {
            var container = document.getElementById('builderCategoryTabs');
            var categories = PIZZA_CATEGORIES;
            container.innerHTML = categories.map(function(cat) {
                return '<button class="builder-tab ' + (state.activeCategory === cat.id ? 'active' : '') + '" onclick="switchBuilderCategory(\'' + cat.id + '\')">' + cat.emoji + ' ' + cat.label + '</button>';
            }).join('');
        }

        function switchBuilderCategory(categoryId) {
            state.activeCategory = categoryId;
            renderBuilderCategoryTabs();
            renderBuilderIngredients();
        }

        function renderBuilderIngredients() {
            var grid = document.getElementById('builderIngredientsGrid');
            var ingredients = PIZZA_INGREDIENTS;
            var filtered = ingredients.filter(function(i) { return i.category === state.activeCategory; });
            grid.innerHTML = filtered.map(function(ing) {
                var isSelected = state.selectedIngredients[ing.id];
                return '<div class="builder-ingredient-card ' + (isSelected ? 'selected' : '') + '" onclick="toggleBuilderIngredient(\'' + ing.id + '\')">' +
                    '<div class="builder-ingredient-emoji">' + ing.emoji + '</div>' +
                    '<div class="builder-ingredient-name">' + ing.name + '</div>' +
                    '<div class="builder-ingredient-price">+R$ ' + ing.price.toFixed(2) + '</div>' +
                '</div>';
            }).join('');
        }

        function toggleBuilderIngredient(ingredientId) {
            if (state.selectedIngredients[ingredientId]) {
                delete state.selectedIngredients[ingredientId];
            } else {
                state.selectedIngredients[ingredientId] = true;
            }
            renderBuilderIngredients();
            updateBuilderOrderPanel();
        }

        function updateBuilderOrderPanel() {
            var ingredients = PIZZA_INGREDIENTS;
            var selected = ingredients.filter(function(i) { return state.selectedIngredients[i.id]; });
            var total = selected.reduce(function(sum, ing) { return sum + ing.price; }, 0);
            var listContainer = document.getElementById('builderOrdersList');
            if (selected.length === 0) {
                listContainer.innerHTML = '<div class="empty-state"><div class="empty-state-text">Selecione ingredientes</div></div>';
            } else {
                listContainer.innerHTML = selected.map(function(ing) {
                    return '<div class="builder-order-item">' +
                        '<div class="builder-order-item-title">' + ing.emoji + ' ' + ing.name + '</div>' +
                        '<div class="builder-order-item-price">+R$ ' + ing.price.toFixed(2) + '</div>' +
                    '</div>';
                }).join('');
            }
            document.getElementById('builderTotalAmount').textContent = 'R$ ' + total.toFixed(2);
        }

        function addBuilderToCart() {
            var ingredients = PIZZA_INGREDIENTS;
            var selected = ingredients.filter(function(i) { return state.selectedIngredients[i.id]; });
            if (selected.length === 0) { alert('Selecione pelo menos um ingrediente!'); return; }
            var total = selected.reduce(function(sum, ing) { return sum + ing.price; }, 0);
            var name = state.builderType === 'pizza' ? 'Pizza Customizada' : 'Hambúrguer Customizado';
            var item = {
                id: Date.now(),
                name: name,
                price: total,
                quantity: 1,
                ingredients: selected.map(function(i) { return { name: i.name, emoji: i.emoji, price: i.price }; }),
                isCustom: true,
                type: state.builderType
            };
            state.cart.push(item);
            saveCart();
            state.selectedIngredients = {};
            renderBuilderIngredients();
            updateBuilderOrderPanel();
            alert('Adicionado ao carrinho!');
        }

        function addAnotherBuilder() {
            state.selectedIngredients = {};
            renderBuilderIngredients();
            updateBuilderOrderPanel();
        }

        function addToCart(productId) {
            var product = state.products.find(function(p) { return p.id === productId; });
            if (!product) return;
            var existingItem = state.cart.find(function(item) { return item.id === productId && !item.isCustom; });
            if (existingItem) {
                existingItem.quantity++;
            } else {
                state.cart.push({ id: productId, name: product.name, price: product.price, quantity: 1, isCustom: false });
            }
            saveCart();
            alert('Adicionado ao carrinho!');
        }

        function updateCartUI() {
            var cartItemsContainer = document.getElementById('cartItems');
            var cartBadge = document.getElementById('cartBadge');
            var cartTotal = document.getElementById('cartTotal');
            if (state.cart.length === 0) {
                cartItemsContainer.innerHTML = '<div class="empty-state"><div class="empty-state-emoji">🛒</div><div class="empty-state-text">Carrinho vazio</div></div>';
                cartBadge.style.display = 'none';
                cartTotal.textContent = 'R$ 0.00';
                return;
            }
            cartBadge.textContent = state.cart.length;
            cartBadge.style.display = 'flex';
            var total = 0;
            cartItemsContainer.innerHTML = state.cart.map(function(item, idx) {
                var itemTotal = item.price * item.quantity;
                total += itemTotal;
                return '<div class="cart-item">' +
                    '<div class="cart-item-name">' + item.name + '</div>' +
                    '<div class="cart-item-price">R$ ' + item.price.toFixed(2) + '</div>' +
                    '<div class="cart-item-controls">' +
                        '<button class="cart-item-btn" onclick="updateCartQuantity(' + idx + ', -1)">−</button>' +
                        '<span class="cart-item-qty">' + item.quantity + '</span>' +
                        '<button class="cart-item-btn" onclick="updateCartQuantity(' + idx + ', 1)">+</button>' +
                        '<button class="cart-item-btn" onclick="removeFromCart(' + idx + ')" style="color: var(--red-accent);">✕</button>' +
                    '</div>' +
                '</div>';
            }).join('');
            cartTotal.textContent = 'R$ ' + total.toFixed(2);
        }

        function updateCartQuantity(idx, change) {
            state.cart[idx].quantity += change;
            if (state.cart[idx].quantity <= 0) { state.cart.splice(idx, 1); }
            saveCart();
        }

        function removeFromCart(idx) { state.cart.splice(idx, 1); saveCart(); }
        function toggleCart() { document.getElementById('cartSidebar').classList.toggle('open'); }

        function openCheckout() {
            if (state.cart.length === 0) { alert('Carrinho vazio!'); return; }
            var total = 0;
            var checkoutItemsContainer = document.getElementById('checkoutItems');
            checkoutItemsContainer.innerHTML = state.cart.map(function(item) {
                var itemTotal = item.price * item.quantity;
                total += itemTotal;
                var ingredientsHTML = '';
                if (item.isCustom && item.ingredients) {
                    ingredientsHTML = item.ingredients.map(function(ing) { return ing.emoji + ' ' + ing.name; }).join(', ');
                }
                return '<div class="checkout-item">' +
                    '<div class="checkout-item-name">' + item.name + ' (' + item.quantity + 'x)</div>' +
                    (ingredientsHTML ? '<div class="checkout-item-ingredients">' + ingredientsHTML + '</div>' : '') +
                    '<div class="checkout-item-price">R$ ' + itemTotal.toFixed(2) + '</div>' +
                '</div>';
            }).join('');
            document.getElementById('checkoutTotalAmount').textContent = 'R$ ' + total.toFixed(2);
            document.getElementById('checkoutModal').classList.add('open');
            document.getElementById('cartSidebar').classList.remove('open');
        }

        function closeCheckout() { document.getElementById('checkoutModal').classList.remove('open'); }

        function sendToWhatsApp() {
            var message = '🍕 *PEDIDO - Oba Dellivery*\n\n📋 *Itens do Pedido:*\n\n';
            var total = 0;
            state.cart.forEach(function(item) {
                var itemTotal = item.price * item.quantity;
                total += itemTotal;
                message += item.quantity + 'x ' + item.name + '\n';
                if (item.isCustom && item.ingredients) {
                    message += '   Ingredientes: ' + item.ingredients.map(function(i) { return i.name; }).join(', ') + '\n';
                }
                message += '   R$ ' + itemTotal.toFixed(2) + '\n\n';
            });
            message += '💰 *Total: R$ ' + total.toFixed(2) + '*\n\nAguardo confirmação do pedido! 😊';
            var url = 'https://wa.me/' + state.whatsappNumber + '?text=' + encodeURIComponent(message);
            window.open(url, '_blank');
        }

        function downloadReceipt() {
            var total = document.getElementById('checkoutTotalAmount').textContent;
            var receiptLines = [];
            state.cart.forEach(function(item) {
                var itemTotal = item.price * item.quantity;
                receiptLines.push({
                    name: item.name,
                    qty: item.quantity,
                    price: itemTotal.toFixed(2),
                    ingredients: (item.isCustom && item.ingredients) ? item.ingredients.map(function(i) { return i.name; }).join(', ') : ''
                });
            });

            var itemsHTML = receiptLines.map(function(line) {
                return '<div style="background:#1f1f1f;border:1px solid #2d2d2d;border-radius:8px;padding:14px;margin-bottom:10px;">' +
                    '<div style="font-weight:900;font-size:15px;color:#f59e0b;margin-bottom:4px;">' + line.qty + 'x ' + line.name + '</div>' +
                    (line.ingredients ? '<div style="font-size:12px;color:#d1d5db;margin-bottom:4px;">Ingredientes: ' + line.ingredients + '</div>' : '') +
                    '<div style="font-weight:900;font-size:14px;color:#f59e0b;">R$ ' + line.price + '</div>' +
                '</div>';
            }).join('');

            var receiptHTML = '<!DOCTYPE html><html lang="pt-BR"><head>' +
                '<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">' +
                '<title>Comprovante - Oba Dellivery</title>' +
                '<style>body{background:#1a1a1a;color:#fff;font-family:Arial,sans-serif;padding:20px;max-width:480px;margin:0 auto;}' +
                'h1{color:#f59e0b;text-align:center;font-size:22px;margin-bottom:6px;}' +
                '.subtitle{text-align:center;color:#d1d5db;font-size:12px;margin-bottom:20px;letter-spacing:1px;text-transform:uppercase;}' +
                '.total-box{background:rgba(245,158,11,0.1);border:2px solid #f59e0b;border-radius:8px;padding:16px;text-align:center;margin-top:16px;}' +
                '.total-label{font-size:12px;color:#d1d5db;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}' +
                '.total-value{font-size:28px;font-weight:900;color:#f59e0b;}' +
                '.footer{text-align:center;color:#d1d5db;font-size:11px;margin-top:20px;padding-top:16px;border-top:1px solid #2d2d2d;}' +
                '@media print{body{background:#fff;color:#000;}h1,.total-value{color:#d97706;}.total-box{border-color:#d97706;}}' +
                '</style></head><body>' +
                '<h1>🍕 OBA DELLIVERY</h1>' +
                '<div class="subtitle">Comprovante do Pedido</div>' +
                itemsHTML +
                '<div class="total-box"><div class="total-label">Total do Pedido</div><div class="total-value">' + total + '</div></div>' +
                '<div class="footer">Obrigado pela preferência! 😊<br>Oba Dellivery</div>' +
                '</body></html>';

            try {
                var blob = new Blob([receiptHTML], { type: 'text/html;charset=utf-8' });
                var url = URL.createObjectURL(blob);
                var newTab = window.open(url, '_blank');
                if (!newTab || newTab.closed || typeof newTab.closed === 'undefined') {
                    var link = document.createElement('a');
                    link.href = url;
                    link.download = 'comprovante-oba-dellivery.html';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
                setTimeout(function() { URL.revokeObjectURL(url); }, 15000);
            } catch (e) {
                alert('Comprovante:\n\n' + receiptLines.map(function(l) { return l.qty + 'x ' + l.name + ' - R$ ' + l.price; }).join('\n') + '\n\nTotal: ' + total);
            }
        }

        function checkAndShowPromotion() {
            if (!promotionShown && state.products.length > 0) {
                var promotion = state.products.find(function(p) { return p.category === 'promocao'; });
                if (promotion) { showPromotion(promotion); promotionShown = true; }
            }
        }

        function showPromotion(product) {
            document.getElementById('promotionImage').src = state.promotionImageUrl;
            document.getElementById('promotionProductName').textContent = product.name;
            document.getElementById('promotionProductDesc').textContent = product.description;
            document.getElementById('promotionProductPrice').textContent = 'R$ ' + product.price.toFixed(2);
            document.getElementById('promotionModal').classList.add('open');
        }

        function closePromotion() { document.getElementById('promotionModal').classList.remove('open'); }

        function addPromotionToCart() {
            var promotion = state.products.find(function(p) { return p.category === 'promocao'; });
            if (promotion) { addToCart(promotion.id); closePromotion(); }
        }
    </script>
</body>
</html>
